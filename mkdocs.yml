site_name: RoboPatch
site_description: Custom asset framework for Robotopia
repo_url: https://github.com/yourusername/RoboPatch
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.instant
    - navigation.tracking

nav:
  - Home: Home.md
  - Getting Started: Getting-Started.md
  - Mod Structure: Mod-Structure.md
  - Mod API Reference: Mod-API-Reference.md
  - Asset Bundle Guide: Asset-Bundle-Guide.md
  - Prompt System: Prompt-System.md
  - Troubleshooting: Troubleshooting.md
  - Roadmap: Roadmap.md

markdown_extensions:
  - admonition
  - codehilite
  - tables
